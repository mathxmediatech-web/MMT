    # 2. WHITELAPTOP (DIGITAL WHITEBOARD SOFTWARE)
    - id: "project-whitelaptop"
      slug: "whitelaptop-digital-whiteboard"
      title: "WhiteLaptop: Smart Interactive Digital Whiteboard Software"
      client_name: "WhiteLaptop Systems"
      client_industry: "EdTech Tools & Productivity"
      category: "Software Development"
      status: "Running"
      status_badge_color: "emerald"
      featured: true
      short_description: "Transforms any standard laptop and graphic pen tablet into a full-scale digital teaching whiteboard, delivering interactive digital board capabilities without costly physical hardware."
      overview: "WhiteLaptop is a high-performance digital whiteboard software engineered specifically for educators and online instructors. By connecting any standard graphic pen tablet to a laptop or PC, teachers get infinite canvas drawing, smooth stylus pressure handwriting, smart geometry recognition, PDF annotating, and lecture recording without buying expensive physical digital panels."
      problem: "Physical smart digital boards cost over ₹1.5L – ₹3L, making high-tech interactive teaching financially inaccessible for individual tutors and small coaching academies."
      solution: "MMT engineered WhiteLaptop—an ultra-low latency desktop/web digital board application providing realistic pen dynamics, gesture navigation, multi-layer canvas, and instant PDF/video lesson export on standard computer hardware."
      technologies:
        - "Electron / Desktop JS"
        - "HTML5 Canvas / WebGL"
        - "React & Tailwind CSS"
        - "Low-Latency Stylus Engine"
        - "FFmpeg Screen Capture"
      services:
        - "Custom Software Development"
        - "Desktop & Web App Engineering"
        - "Hardware-Stylus Integration"
      features:
        - "Infinite multi-layer canvas with smooth stylus response"
        - "Natural pen tablet pressure sensitivity & smart shape smoothing"
        - "Instant PDF, PPT & image document import for live annotation"
        - "Integrated HD lecture screen & audio recorder with 1-click export"
        - "Dual-screen presentation mode for online Zoom/OBS teaching"
        - "Custom background grids: Dark mode, Ruled paper, Graph & Coordinate axes"
      metrics:
        - label: "Hardware Cost Savings"
          value: "Significant Cost Savings"
        - label: "Pen Drawing Latency"
          value: "< 12ms"
        - label: "Supported Formats"
          value: "PDF, PPT, MP4"
      image: "/images/projects/project-02.svg"
      live_url: "https://whitelaptop.mathxmedia.tech"
      case_study_url: "/projects/whitelaptop-digital-whiteboard"

    # 3. RESTOOS (RESTAURANT MANAGEMENT SAAS)
    - id: "project-restoos"
      slug: "restoos-restaurant-saas"
      title: "RestoOS: Complete Restaurant Operations & POS SaaS"
      client_name: "RestoOS Cloud"
      client_industry: "Hospitality & Food Tech"
      category: "Business Automation"
      status: "Running"
      status_badge_color: "emerald"
      featured: true
      short_description: "All-in-one restaurant management platform controlling the complete customer journey from table entry and contactless QR ordering to instant KOT kitchen dispatch and rapid POS billing."
      overview: "RestoOS eliminates dining room bottlenecks and order confusion with a unified digital operations system. Waiters and customers can place orders directly to kitchen display screens (KOT), while managers track table occupancy, manage raw inventory, split bills, and generate GST compliance receipts in seconds."
      problem: "Traditional restaurants suffer from slow manual table ordering, handwritten kitchen ticket mistakes, delayed bill generation during rush hours, and unmonitored raw material leakage."
      solution: "MMT engineered RestoOS to optimize table turnaround times by 35% with real-time kitchen order synchronization, multi-counter dispatch, digital QR menus, and lightning-fast checkout."
      technologies:
        - "Next.js & React"
        - "Node.js WebSockets"
        - "PostgreSQL & Redis"
        - "Thermal Printer API"
        - "Razorpay UPI QR"
      services:
        - "Business Automation"
        - "SaaS Product Development"
        - "Point of Sale (POS) Engineering"
      features:
        - "Interactive table floorplan with live occupancy status"
        - "Contactless dynamic QR code table ordering & digital menu"
        - "Instant Kitchen Order Ticket (KOT) routing to kitchen displays/printers"
        - "High-speed POS checkout with split billing & multi-mode payments"
        - "Raw material inventory tracking with low-stock alerts"
        - "Comprehensive sales analytics & daily automated P&L reports"
      metrics:
        - label: "Order-to-Kitchen Speed"
          value: "Instant (< 1s)"
        - label: "Table Turnover Rate"
          value: "+35% Faster"
        - label: "Kitchen Synchronization"
          value: "Reliable KOT Dispatch"
      image: "/images/projects/project-03.svg"
      live_url: "https://restoos.mathxmedia.tech"
      case_study_url: "/projects/restoos-restaurant-saas"

    # 4. VIPRA SEVA SETU (SERVICE WORKERS MARKETPLACE APP)
    - id: "project-vipra-seva-setu"
      slug: "vipra-seva-setu-app"
      title: "Vipra Seva Setu: Verified On-Demand Services Marketplace"
      client_name: "Vipra Seva Setu (Client Project)"
      client_industry: "On-Demand Services & Marketplace"
      category: "Software Development"
      status: "Ongoing"
      status_badge_color: "sky"
      featured: true
      short_description: "Community marketplace app connecting households and businesses with verified electricians, plumbers, carpenters, and maintenance technicians."
      overview: "Vipra Seva Setu is a dedicated mobile application connecting residents, home owners, and commercial business owners with skilled local service professionals. The platform prioritizes safety and trust through government ID verification requirements, transparent rate cards, and direct in-app booking."
      problem: "Households and businesses face safety risks, unreliable pricing, and unverified worker backgrounds when hiring informal technicians for home repairs and emergency maintenance."
      solution: "MMT is building an on-demand service marketplace with strict multi-step worker KYC verification, geo-located technician dispatch, emergency service scheduling, and transparent digital invoice payments."
      technologies:
        - "React Native (iOS & Android)"
        - "Node.js / Express API"
        - "PostgreSQL"
        - "Geo-Location & Google Maps SDK"
        - "Aadhaar/ID Verification API"
      services:
