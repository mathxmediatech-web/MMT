    # 5. GYMFLOW SAAS (GYM OS & INTEGRATED E-COMMERCE)
    - id: "project-gymflow-saas"
      slug: "gymflow-gym-saas"
      title: "GymFlow: All-in-One Gym Management & Integrated E-Commerce SaaS"
      client_name: "GymFlow Network"
      client_industry: "Fitness & Health Tech"
      category: "Business Automation"
      status: "Running"
      status_badge_color: "emerald"
      featured: true
      short_description: "All-in-one gym operating system active across 5+ gyms, managing trainers, member subscriptions, attendance, and featuring an integrated e-commerce store for supplement & merchandise sales."
      overview: "GymFlow SaaS is a modern fitness business platform currently operating across 5+ partner gyms. Gym owners and administrators manage trainer schedules, track member attendance via biometric/QR check-in, send automated WhatsApp fee renewal alerts, and monetize their member base with a built-in e-commerce storefront for supplements and fitness gear without maintaining separate software."
      problem: "Gym owners struggle with fee collection follow-ups, trainer performance tracking, and lose thousands in monthly retail revenue because they lack an easy way to sell supplements online to their members."
      solution: "MMT engineered GymFlow SaaS to combine full club management with a plug-and-play e-commerce storefront, allowing owners to manage memberships and sell products in one single dashboard."
      technologies:
        - "Next.js & React"
        - "Node.js / Express"
        - "PostgreSQL Database"
        - "WhatsApp Business Cloud API"
        - "Integrated Payment Gateway (UPI / Cards)"
      services:
        - "SaaS Product Development"
        - "Business Automation"
        - "E-Commerce Engineering"
      features:
        - "Member subscription tracking with automated WhatsApp expiry reminders"
        - "Trainer management: Personal training sessions, client assignments & commissions"
        - "Built-in E-Commerce Store: Sell supplements, protein, gym wear & accessories"
        - "QR code and digital member check-in attendance system"
        - "Custom workout & personalized diet plan builder for trainers"
        - "Executive revenue dashboard: Membership dues vs retail product sales"
      metrics:
        - label: "Active Connected Gyms"
          value: "5+ Gyms Live"
        - label: "Renewal Fee Recovery"
          value: "+45% on WhatsApp"
        - label: "E-Commerce Setup"
          value: "Streamlined Setup"
      image: "/images/projects/project-05.svg"
      live_url: "https://gymflow.mathxmedia.tech"
